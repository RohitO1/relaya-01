org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was enabled for KGP migration
android.builtInKotlin=true
# This newDsl flag was enabled for KGP migration
android.newDsl=true
# Disable VFS watching to avoid MD5 hash failures on macOS Desktop / iCloud
org.gradle.vfs.watch=false
# Disable configuration cache to avoid stale file state issues
org.gradle.configuration-cache=false
