org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was enabled for KGP migration
android.builtInKotlin=true
# This newDsl flag was enabled for KGP migration
android.newDsl=true
# Disable VFS watching to avoid MD5 hash failures on macOS Desktop / iCloud
org.gradle.vfs.watch=false
# Disable configuration cache to avoid stale file state issues
org.gradle.configuration-cache=false

# Mapbox downloads token — stored in local.properties (gitignored) to avoid secret scanning
# Add this line to android/local.properties:
#   MAPBOX_DOWNLOADS_TOKEN=sk.your_actual_token_here
